name: tests
on: [push, pull_request]
jobs:
  emulator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev,plots]'
      - run: pytest -q
      - run: python -m ffr experiment --quick --out results
  testbed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e . -r testbed/requirements.txt
      - run: pytest -q testbed/test_osken_app.py
